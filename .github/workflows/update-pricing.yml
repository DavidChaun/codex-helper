name: Update GPT pricing
on:
  schedule:
    - cron: '37 3 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency: update-gpt-pricing
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
      - name: Refresh appcast pricing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --max-time 60 \
            https://raw.githubusercontent.com/BerriAI/litellm/main/model_prices_and_context_window.json \
            -o "$RUNNER_TEMP/model-prices.json"
          python3 scripts/update-pricing-feed.py < "$RUNNER_TEMP/model-prices.json"
          if ! git diff --quiet -- appcast.xml; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add appcast.xml
            git commit -m 'Refresh GPT pricing catalog'
            git push origin HEAD:main
          fi
          curl -fsSL --retry 3 --max-time 60 \
            https://davidchaun.github.io/codex-helper/appcast.xml -o "$RUNNER_TEMP/live-appcast.xml"
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]] || ! cmp -s appcast.xml "$RUNNER_TEMP/live-appcast.xml"; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" --silent
          fi
